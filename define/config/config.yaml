samples: /projetos/ridh/angelo/omniomics/runs/define/samples.tsv
output_root: /projetos/ridh/angelo/omniomics/runs/define/out
databases:
  bakta: /projetos/ridh/gabrielcoelho/databases/bakta/db-light
  eggnog: /projetos/ridh/gabrielcoelho/databases/eggnog_db
  reference_genome: /projetos/ridh/angelo/omniomics/data/define/reference/GCF_000005845.2_genomic.fna
params:
  fastp: --qualified_quality_phred 20 --unqualified_percent_limit 20 --length_required
    36 --cut_right --detect_adapter_for_pe
  fastqc: ''
  multiqc: ''
  bakta_reference: --complete --skip-trna --skip-rrna --skip-ncrna --skip-crispr
  eggnog_reference: --sensmode fast --dmnd_iterate no
  bowtie2: --no-unal
  samtools_index: ''
  rseqc: -s 500000
  featurecounts: -t CDS -g locus_tag --countReadPairs
  merge_annotated_counts: ''
  qc_summary: ''
threads:
  fastp: 8
  fastqc: 4
  multiqc: 1
  bakta_reference: 16
  eggnog_reference: 16
  bowtie2: 16
  samtools_index: 8
  rseqc: 1
  featurecounts: 8
  merge_annotated_counts: 1
  qc_summary: 1
