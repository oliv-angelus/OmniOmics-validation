# ==============================================================================
# CONFIG FOR PROJECT "v-magma" (Deliverable B validation, tapajos cluster, UFOPA)
# ==============================================================================
# Generated 2026-09-12 from the local staging copy
# MAGMA-HPC/benchmark_zymo/config/config.yaml, adapted to the real path
# where the FASTQs were already downloaded (validacao/v-magma/, not
# magma-benchmark-zymo/ -- the local staging project's name had gone
# stale relative to the validacao/v-<pipeline> convention used for the
# rest of the validation).
#
# Dataset: ZymoBIOMICS mock community "even", hybrid Illumina+Nanopore
# GridION (Nicholls et al. 2019, GigaScience, DOI 10.1093/gigascience/
# giz043) -- see OmniOmics/notes/OmniOmics Tool Paper Plan.md,
# Deliverable B, MAGMA row. The "log" community (ERR2935805 +
# ERR3152366) can be added later as a second sample.
#
# pfam NOT downloaded yet (same real gap as SIGMA) -- omit bigscape
# when running: --omit-from bigscape.

samples: "/projetos/ridh/gabrielcoelho/validacao/v-magma/config/samples.tsv"
output_root: "/projetos/ridh/gabrielcoelho/validacao/v-magma/runs/run1"

long_read_platform:
  spades_flag: "--nanopore"
  flye_flag: "--nano-hq"
  minimap2_preset: "map-ont"

databases:
  checkm2:        "/projetos/ridh/gabrielcoelho/databases/CheckM2_database/uniref100.KO.1.dmnd"
  antismash:      "/projetos/ridh/gabrielcoelho/databases/antismash_db"
  eggnog:         "/projetos/ridh/gabrielcoelho/databases/eggnog_db"
  gtdbtk:         "/projetos/ridh/gabrielcoelho/databases/gtdbtk_db"
  gunc:           "/projetos/ridh/gabrielcoelho/databases/gunc_db"
  pfam:           "/projetos/ridh/gabrielcoelho/databases/pfam_db/Pfam-A.hmm"   # NAO baixado -- omitir bigscape
  kraken2:        "/projetos/ridh/gabrielcoelho/databases/k2-plusPFP_db"
  kaiju:          "/projetos/ridh/gabrielcoelho/databases/kaiju_db"
  amrfinderplus:  "/projetos/ridh/gabrielcoelho/databases/AMRfinder_db/latest"
  checkv:         "/projetos/ridh/gabrielcoelho/databases/checkv_db/checkv-db-v1.5"
  virsorter2:     "/projetos/ridh/gabrielcoelho/databases/virsorter2_db"
  genomad:        "/projetos/ridh/gabrielcoelho/databases/genomad_db"

# Parameters and threads: identical to the template (calibrated on the
# caves production run, tapajos' 128-core/252GB nodes) -- no reason to
# diverge just because this is a different dataset. Revisit only if the
# dry-run/first real run shows a need to.
params:
  fastp:             "--qualified_quality_phred 30 --length_required 50 --trim_front1 1 --trim_front2 1"
  filtlong:          "--min_length 500 --keep_percent 90"
  metaquast:         "--max-ref-number 0"
  kraken2:           "--confidence 0.05"
  kaiju:             ""
  bracken:           "-l S -r 150"
  kreport2mpa:       ""
  megahit:           "--min-contig-len 300 -m 0.85"
  metaspades_hybrid: "-m 60"
  flye:              ""
  tiara:             "--min_len 500"
  bowtie2:            ""
  minimap2:          ""
  jgi_summarize:     ""
  samtools_index:    ""
  metabat2:          ""
  semibin2:          "--environment global"
  vamb:              "--minfasta 10000 -m 500"
  maxbin2:           ""
  binette:           "-v"
  checkm2:           ""
  gunc:              ""
  drep:              "-comp 50 -con 10"
  gtdbtk:            "--pplacer_cpus 8"
  mags_annot:
    hq_min_completeness: 70
    hq_max_contamination: 10
  prodigal:          ""
  eggnog:             ""
  abricate:          ""
  amrfinderplus:     ""
  checkv:            ""
  virsorter2:        ""
  genomad:            ""
  minced:            ""
  antismash:         ""
  bigscape:          "--mix --classify none"
  mobsuite:          ""
  vfdb:              ""
  barrnap:           "--kingdom bac"
  trnascan:          "-B"
  coverm:            "--min-covered-fraction 0"

active_binners:
  - metabat2
  - semibin2
  - maxbin2
  - vamb

threads:
  fastp: 8
  prodigal: 8
  megahit: 64
  flye: 64
  metaspades_hybrid: 64
  bowtie2: 48
  minimap2: 16
  samtools_index: 8
  metabat2: 24
  maxbin2: 24
  semibin2: 32
  vamb: 16
  binette: 24
  checkm2: 16
  gunc: 16
  drep: 24
  gtdbtk: 64
  coverm: 16
  eggnog: 16
  abricate: 8
  amrfinderplus: 8
  antismash: 32
  bigscape: 8
  mobsuite: 8
  barrnap: 8
  trnascan: 8
  kraken2: 16
  kaiju: 16
  metaquast: 8
  tiara: 8
  vfdb: 8
  virsorter2: 16
  checkv: 16
  genomad: 16
