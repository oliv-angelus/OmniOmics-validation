samples: /projetos/ridh/angelo/omniomics/runs/dogma/samples.tsv
active_tools:
- domain_filter
- rnaspades
- megahit
- trinity
output_root: /projetos/ridh/angelo/omniomics/runs/dogma/out
databases:
  kraken2: /projetos/ridh/gabrielcoelho/databases/k2-plusPFP_db
  kaiju: /projetos/ridh/gabrielcoelho/databases/kaiju_db
  eggnog: /projetos/ridh/gabrielcoelho/databases/eggnog_db
  cazy: /projetos/ridh/gabrielcoelho/databases/cazy_db
  ncycdb: /projetos/ridh/gabrielcoelho/databases/ncycdb_db
  scycdb: /projetos/ridh/gabrielcoelho/databases/scycdb_db
  mcycdb: /projetos/ridh/gabrielcoelho/databases/mcycdb_db
  canthyd: /projetos/ridh/gabrielcoelho/databases/canthyd_db
params:
  fastp: --qualified_quality_phred 30 --length_required 50 --trim_front1 1 --trim_front2
    1
  filtlong: --min_length 500 --keep_percent 90
  ribodetector: -e norrna --chunk_size 200
  kraken2: --confidence 0.05
  kaiju: ''
  domain_filter:
    mode: prokaryote
  rnaspades: ''
  megahit: ''
  trinity: --max_memory 50G
  transcript_set_step1: --min-seq-id 1.00 --cov-mode 1 -c 0.98
  transcript_set: --min-seq-id 0.98 --cov-mode 1 -c 0.98
  transdecoder: ''
  eggnog: --dbmem
  cazy: ''
  ncycdb: -k 1 -e 0.0001
  scycdb: -k 1 -e 0.0001
  mcycdb: -k 1 -e 0.0001
  canthyd: --cut_tc
  fegenie: ''
  eukulele_database: marmmetsp
  eukulele: --no_busco
  cat_database: GTDB
  cat: ''
  magma_xref: -k 1 -e 0.0001
  salmon_index: -k 31
  salmon: ''
threads:
  fastp: 8
  ribodetector: 8
  kraken2: 16
  kaiju: 16
  rnaspades: 32
  megahit: 32
  trinity: 32
  transcript_set: 8
  transdecoder: 4
  eggnog: 16
  cazy: 8
  ncycdb: 8
  scycdb: 8
  mcycdb: 8
  canthyd: 4
  fegenie: 4
  eukulele: 16
  cat: 16
  magma_xref: 8
  salmon: 8
