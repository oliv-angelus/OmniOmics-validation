samples: /projetos/ridh/angelo/omniomics/runs/prism/samples.tsv
output_root: /projetos/ridh/angelo/omniomics/runs/prism/out
databases:
  emu_16s: /projetos/ridh/angelo/omniomics/databases/emu_16s
  gtdb_ssu: /projetos/ridh/gabrielcoelho/databases/gtdb_ssu_db/GTDB_bac120_arc53_ssu_r220_fullTaxo.fa
amplicon_preset:
  id: 16s_ont_mab_kit
  gene: 16S
  reference_db: gtdb
  fwd_primers:
  - AGRGTTYGATYMTGGCTCAG
  - AGAGTTTGATCCTGGCTTAG
  - AGAATTTGATCTTRGTTCAG
  - AGAGTTTGATCATGGCTCAG
  rev_primers:
  - SGGYTACCTTGTTACGACTT
  - CGGCTACCTTGTTACGACTT
  - GGGCTACCTTGTTACGACTT
  min_length: 1300
  max_length: 1700
params:
  nanoplot: ''
  filtlong: --keep_percent 90
  cutadapt: -e 0.1
  vsearch_chimera: --id 0.95 --abskew 2.0
  dada2_pacbio: --gene 16S --reference_db gtdb --max_ee 2.0 --min_asv_totalfreq 5
  emu_ont: --gene 16S --reference_db emu --min-abundance 0.0001
  picrust2: --max_nsti 2.0
  fastp: --qualified_quality_phred 20 --length_required 50
  cutadapt_short: -e 0.1
  dada2_illumina: --gene 12S --reference_db mitofish --max_ee 2.0 --min_asv_totalfreq
    5
threads:
  nanoplot: 8
  filtlong: 4
  cutadapt: 8
  vsearch_chimera: 8
  dada2_pacbio: 16
  emu_ont: 16
  emu_tree: 16
  picrust2: 8
  fastp: 16
  cutadapt_short: 16
  dada2_illumina: 48
