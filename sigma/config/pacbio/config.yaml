# ==============================================================================
# SIGMA CONFIG (tapajos cluster, UFOPA) -- reusable template
# ==============================================================================
# Swap validacao/v-sigma for the 2 placeholders (samples:/output_root:) before use,
# same pattern as MAGMA-root/project_template.
#
# Databases: ALL already confirmed present on the cluster as of 2026-09-09
# (a real ls, not assumed) -- including bakta and VIBRANT, which I'd
# expected to have to download again. Only pfam is missing (the same gap
# MAGMA already has -- disable bigscape with --omit-from bigscape until
# that's resolved).

samples: "/projetos/ridh/gabrielcoelho/validacao/v-sigma-pacbio/config/samples.tsv"
output_root: "/projetos/ridh/gabrielcoelho/validacao/v-sigma-pacbio/runs/run1"

long_read_platform:
  # pacbio_raw (CLR) -- SRR8154675 (McIntyre et al. 2019) is PacBio RS II
  # subreads, an old CLR platform, not HiFi (Sequel II+). See
  # pipeline.yaml's long_read_platforms for that distinction.
  id: "pacbio_raw"
  spades_flag: "--pacbio"
  flye_flag: "--pacbio-raw"
  minimap2_preset: "map-pb"

databases:
  checkm2:        "/projetos/ridh/gabrielcoelho/databases/CheckM2_database/uniref100.KO.1.dmnd"
  antismash:      "/projetos/ridh/gabrielcoelho/databases/antismash_db"
  eggnog:         "/projetos/ridh/gabrielcoelho/databases/eggnog_db"
  gtdbtk:         "/projetos/ridh/gabrielcoelho/databases/gtdbtk_db"
  gunc:           "/projetos/ridh/gabrielcoelho/databases/gunc_db"  # real finding 2026-09-12: the gunc rule never had this key
  kraken2:        "/projetos/ridh/gabrielcoelho/databases/k2-plusPFP_db"
  kaiju:          "/projetos/ridh/gabrielcoelho/databases/kaiju_db"
  amrfinderplus:  "/projetos/ridh/gabrielcoelho/databases/AMRfinder_db/latest"
  checkv:         "/projetos/ridh/gabrielcoelho/databases/checkv_db/checkv-db-v1.5"
  virsorter2:     "/projetos/ridh/gabrielcoelho/databases/virsorter2_db"
  genomad:        "/projetos/ridh/gabrielcoelho/databases/genomad_db"
  bakta:          "/projetos/ridh/gabrielcoelho/databases/bakta/db-light"
  vibrant_files:  "/projetos/ridh/gabrielcoelho/databases/VIBRANT"
  pfam:           "/projetos/ridh/gabrielcoelho/databases/pfam_db/Pfam-A.hmm"   # NOT downloaded -- omit bigscape (--omit-from bigscape)

# Extracted from pipelines/sigma/pipeline.yaml "defaults" (2026-09-09) --
# the app's own default values, no reason to diverge on a first test.
params:
  fastp:          "--qualified_quality_phred 30 --length_required 50 --trim_front1 1 --trim_front2 1"
  filtlong:       "--min_length 500 --keep_percent 90"
  kraken2:        "--confidence 0.05"
  kaiju:          ""
  unicycler:      ""
  flye:           ""
  racon:          ""
  medaka:         ""
  ragtag:         "-u"
  bowtie2:        ""
  minimap2:       ""
  samtools_index: ""
  quast:          ""
  checkm2:        ""
  gunc:           ""
  gtdbtk:         ""
  coverm:         "--min-covered-fraction 0"
  bakta:          ""
  eggnog:         ""
  amrfinderplus:  ""
  abricate:       ""
  vfdb:           ""
  isescan:        ""
  mobsuite:       ""
  mlst:           ""
  genomad:        ""
  virsorter2:     ""
  checkv:         ""
  vibrant:        ""
  antismash:      ""
  bigscape:       "--mix --classify none"

# threads: base = pipeline.yaml default_threads (app), shared databases
# (kraken2/kaiju/gtdbtk/checkm2/gunc/eggnog/antismash/coverm) scaled to
# the same value already validated on MAGMA -- same cluster, same
# database. The rest = app default (1 isolate is much lighter than 1
# metagenome, so not everything was scaled the same as MAGMA). FIRST
# PASS -- adjust after the first real run (same process MAGMA went
# through).
threads:
  fastp: 8
  kraken2: 16
  kaiju: 16
  unicycler: 32
  flye: 64
  racon: 16
  medaka: 16
  ragtag: 8
  bowtie2: 16
  minimap2: 16
  samtools_index: 8
  quast: 8
  checkm2: 16
  gunc: 16
  gtdbtk: 64
  coverm: 16
  bakta: 16
  eggnog: 16
  amrfinderplus: 8
  abricate: 8
  vfdb: 8
  isescan: 8
  mobsuite: 8
  mlst: 4
  genomad: 16
  virsorter2: 16
  checkv: 16
  vibrant: 16
  antismash: 32
  bigscape: 8
